services:
  school-portal-api:
    build: .
    container_name: school-portal-api
    restart: always
    ports:
      - "4050:4050"
    env_file:
      - .env

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4050/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s